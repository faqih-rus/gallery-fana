services:
  galeri-romantis:
    build:
      context: .
      dockerfile: Dockerfile
    image: galeri-romantis:latest
    container_name: galeri-romantis
    restart: unless-stopped
    ports:
      # host:container  -> samakan dengan HOST_PORT di deploy.sh
      - "8094:80"
    volumes:
      # PENTING: data pengguna disimpan di HOST, jadi tidak hilang saat rebuild / git pull.
      # Path ini HARUS sama dengan DATA_ROOT di deploy.sh (/var/lib/${APP_NAME}).
      # Dipakai bersama oleh container dev (docker-compose.dvlp.yml) agar data sinkron.
      - /var/lib/gallery-fana/uploads:/var/www/html/uploads
      - /var/lib/gallery-fana/data:/var/www/html/data
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/')?0:1);"]
      interval: 30s
      timeout: 5s
      retries: 3
