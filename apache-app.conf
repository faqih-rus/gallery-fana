# Galeri romantis — konfigurasi Apache tambahan (mod_php)

# Jadikan gallery.php halaman utama saat membuka "/"
DirectoryIndex gallery.php index.php index.html

# Folder data (photos.json) TIDAK boleh diakses dari web
<Directory /var/www/html/data>
    Require all denied
</Directory>

# Folder uploads hanya untuk gambar — matikan eksekusi skrip di sini
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|phar|cgi|pl)$">
        Require all denied
    </FilesMatch>
</Directory>

# Security headers ringan (sejajar dengan contoh nginx kamu)
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
